name: Build site

# Rebuilds site/ from the data and commits it to main. cPanel's Git Version
# Control pulls main and .cpanel.yml copies site/ into public_html (see DEPLOY.md).
# Pushes made with GITHUB_TOKEN do not trigger this workflow again.

on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  workflow_dispatch:
  schedule:
    # Daily rebuild (06:23 Asia/Dhaka) so passed deadlines drop off and counts stay current.
    - cron: "23 0 * * *"

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 tools/build_site.py

      - name: Commit site/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git commit -q -m "Build site from ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
